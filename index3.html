<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080908">
    <title>Gather &amp; Plate | Recipe finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --paper: #080908;
            --ink: #f5f5f0;
            --muted: #b1b5ad;
            --line: #333832;
            --tomato: #dc583d;
            --tomato-dark: #f08368;
            --olive: #bdc9ae;
            --white: #151815;
            --serif: "Playfair Display", Georgia, serif;
            --sans: "DM Sans", sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        .smoke-field {
            position: fixed;
            z-index: 0;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .smoke-field::before, .smoke-field::after {
            content: "";
            position: absolute;
            width: 130vw;
            height: 125vh;
            left: -15vw;
            bottom: -62vh;
            filter: blur(34px);
            will-change: transform, opacity;
        }
        .smoke-field::before {
            background:
                radial-gradient(ellipse 17% 38% at 12% 74%, rgba(198, 204, 193, .17), transparent 76%),
                radial-gradient(ellipse 23% 46% at 37% 67%, rgba(174, 183, 168, .12), transparent 78%),
                radial-gradient(ellipse 18% 41% at 67% 76%, rgba(198, 204, 193, .14), transparent 76%),
                radial-gradient(ellipse 24% 42% at 91% 68%, rgba(174, 183, 168, .11), transparent 78%);
            animation: smoke-drift 30s ease-in-out infinite alternate;
        }
        .smoke-field::after {
            left: -8vw;
            bottom: -69vh;
            width: 116vw;
            height: 128vh;
            filter: blur(46px);
            background:
                radial-gradient(ellipse 19% 43% at 22% 73%, rgba(216, 220, 211, .10), transparent 78%),
                radial-gradient(ellipse 15% 36% at 53% 66%, rgba(190, 197, 183, .12), transparent 75%),
                radial-gradient(ellipse 23% 45% at 82% 78%, rgba(216, 220, 211, .09), transparent 80%);
            animation: smoke-drift 39s ease-in-out -17s infinite alternate-reverse;
        }
        .topbar, main, footer { position: relative; z-index: 1; }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .topbar {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(5.5vw, 24px);
            border-bottom: 1px solid var(--line);
            background: rgba(8, 9, 8, .96);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0;
            text-decoration: none;
        }
        .brand-mark {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--tomato);
            color: white;
            font-family: var(--serif);
            font-size: 20px;
        }
        .top-note { color: var(--muted); font-size: 12px; }
        main { max-width: 1280px; margin: 0 auto; padding: 0 32px 80px; }
        .hero {
            position: relative;
            min-height: 316px;
            display: flex;
            align-items: center;
            margin: 25px 0 38px;
            padding: 48px 7.2%;
            overflow: hidden;
            border-radius: 5px;
            background: rgba(20, 23, 19, .78);
        }
        .hero::after {
            content: "";
            position: absolute;
            top: -110px;
            right: -65px;
            width: 460px;
            height: 460px;
            border: 1px solid rgba(82, 100, 74, .2);
            border-radius: 50%;
            box-shadow: 0 0 0 34px rgba(82, 100, 74, .035), 0 0 0 72px rgba(82, 100, 74, .035);
        }
        .hero-copy { position: relative; z-index: 1; max-width: 620px; }
        .eyebrow {
            margin: 0 0 14px;
            color: var(--olive);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }
        h1, h2, h3, p { margin-top: 0; }
        .hero h1 {
            max-width: 570px;
            margin-bottom: 13px;
            font-family: var(--serif);
            font-size: clamp(38px, 5vw, 58px);
            font-weight: 500;
            line-height: 1.08;
        }
        .hero-copy > p:last-child { margin: 0; color: #c1c5bc; font-size: 14px; }
        .search-wrap {
            position: relative;
            z-index: 2;
            width: min(100%, 600px);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            padding: 7px 8px 7px 17px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 4px;
            background: var(--white);
            box-shadow: 0 7px 20px rgba(36, 42, 31, .07);
        }
        .search-icon { flex: 0 0 auto; width: 18px; color: var(--muted); }
        .search-wrap input {
            width: 100%;
            min-width: 0;
            height: 40px;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--ink);
            font-size: 14px;
        }
        .search-wrap input::placeholder { color: #a4a9a1; }
        .search-wrap button {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 19px;
            border: 0;
            border-radius: 3px;
            background: var(--tomato);
            color: white;
            font-size: 13px;
            font-weight: 700;
            transition: background .18s ease;
        }
        .search-wrap button:hover { background: var(--tomato-dark); }
        .toolbar {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 20px;
        }
        .section-heading h2 {
            margin: 0 0 4px;
            font-family: var(--serif);
            font-size: 27px;
            font-weight: 600;
        }
        .result-count { margin: 0; color: var(--muted); font-size: 12px; }
        .filters { display: flex; align-items: end; gap: 10px; }
        .filter-field { display: grid; gap: 6px; }
        .filter-field label {
            color: #c1c5bc;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .7px;
            text-transform: uppercase;
        }
        .filter-field select {
            width: 150px;
            height: 39px;
            padding: 0 30px 0 11px;
            border: 1px solid var(--line);
            border-radius: 3px;
            outline-color: var(--olive);
            background: var(--white);
            color: var(--ink);
            font-size: 12px;
        }
        .filter-field.sort select { width: 144px; }
        .reset-button {
            height: 39px;
            padding: 0 10px;
            border: 0;
            background: transparent;
            color: var(--tomato-dark);
            font-size: 12px;
            font-weight: 600;
        }
        .reset-button:hover { text-decoration: underline; }
        .meal-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 18px; }
        .meal-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid #30352f;
            border-radius: 4px;
            background: var(--white);
            animation: reveal .42s both;
        }
        .meal-card:nth-child(2n) { animation-delay: .035s; }
        .photo-wrap { position: relative; aspect-ratio: 1.28; overflow: hidden; background: #20241f; }
        .meal-photo { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
        .meal-card:hover .meal-photo { transform: scale(1.035); }
        .save-button {
            position: absolute;
            top: 11px;
            right: 11px;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 50%;
            background: rgba(21, 24, 21, .96);
            color: #f5f5f0;
            transition: color .16s ease, transform .16s ease;
        }
        .save-button:hover { transform: scale(1.06); }
        .save-button.is-saved { color: var(--tomato); }
        .save-button svg { width: 17px; height: 17px; }
        .card-content { padding: 15px 15px 14px; }
        .card-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; color: var(--muted); font-size: 10px; }
        .category-pill { color: var(--olive); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
        .meta-dot { color: #777e73; }
        .card-content h3 {
            min-height: 48px;
            margin: 0 0 13px;
            font-family: var(--serif);
            font-size: 19px;
            font-weight: 600;
            line-height: 1.25;
        }
        .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 11px; border-top: 1px solid #efeee8; }
        .area-label { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        .details-button {
            flex: 0 0 auto;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--tomato-dark);
            font-size: 11px;
            font-weight: 700;
        }
        .details-button:hover { text-decoration: underline; }
        .state-message { grid-column: 1 / -1; padding: 72px 16px; text-align: center; }
        .state-message h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 25px; }
        .state-message p { margin: 0; color: var(--muted); font-size: 13px; }
        .spinner { width: 29px; height: 29px; margin: 0 auto 15px; border: 3px solid #40443d; border-top-color: var(--tomato); border-radius: 50%; animation: spin .8s linear infinite; }
        .modal-backdrop {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 22px;
            background: rgba(25, 29, 24, .62);
            animation: fade .18s ease;
        }
        .recipe-modal {
            position: relative;
            width: min(880px, 100%);
            max-height: min(90vh, 900px);
            overflow: auto;
            border-radius: 5px;
            background: var(--white);
            box-shadow: 0 20px 70px rgba(0, 0, 0, .22);
        }
        .modal-close {
            position: absolute;
            z-index: 1;
            top: 13px;
            right: 13px;
            width: 39px;
            height: 39px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: rgba(21, 24, 21, .96);
            color: var(--ink);
            font-size: 22px;
        }
        .modal-media { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: #080908; }
        .modal-photo, .modal-video { width: 100%; aspect-ratio: 16 / 9; border: 0; background: #20241f; }
        .modal-photo { object-fit: cover; }
        .modal-video { display: block; }
        .modal-body { padding: 28px 34px 36px; }
        .modal-body h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 35px; line-height: 1.15; }
        .modal-subtitle { margin-bottom: 25px; color: var(--olive); font-size: 12px; font-weight: 600; }
        .modal-columns { display: grid; grid-template-columns: minmax(190px, .7fr) 1.3fr; gap: 36px; }
        .modal-columns h3 { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; }
        .ingredients { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
        .ingredients li { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 7px; border-bottom: 1px solid #333832; color: #e1e3de; font-size: 12px; }
        .ingredients li span:last-child { color: var(--muted); text-align: right; }
        .instructions { color: #e1e3de; font-size: 13px; line-height: 1.75; white-space: pre-line; }
        .modal-links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 19px; }
        .modal-links a { color: var(--tomato-dark); font-size: 12px; font-weight: 700; text-decoration: none; }
        .modal-links a:hover { text-decoration: underline; }
        footer { padding: 24px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 11px; }
        @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes smoke-drift {
            from { transform: translate3d(-2%, 4%, 0) scale(1); opacity: .55; }
            to { transform: translate3d(3%, -6%, 0) scale(1.08); opacity: .95; }
        }
        @media (max-width: 1000px) { .meal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 740px) {
            main { padding: 0 20px 56px; }
            .topbar { height: 64px; padding: 0 20px; }
            .top-note { display: none; }
            .hero { min-height: 300px; margin: 18px 0 31px; padding: 39px 7%; }
            .hero::after { right: -280px; }
            .toolbar { align-items: start; flex-direction: column; gap: 17px; }
            .filters { width: 100%; flex-wrap: wrap; }
            .filter-field { flex: 1 1 130px; }
            .filter-field select, .filter-field.sort select { width: 100%; }
            .reset-button { align-self: end; }
            .meal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 12px; }
            .card-content { padding: 12px; }
            .card-content h3 { min-height: 44px; font-size: 17px; }
            .modal-media { grid-template-columns: 1fr; }
            .modal-body { padding: 23px 22px 28px; }
            .modal-body h2 { font-size: 29px; }
            .modal-columns { grid-template-columns: 1fr; gap: 24px; }
        }
        @media (max-width: 430px) {
            main { padding-right: 14px; padding-left: 14px; }
            .hero { min-height: 285px; padding: 33px 20px; }
            .hero h1 { font-size: 39px; }
            .search-wrap { gap: 8px; padding-left: 12px; }
            .search-wrap button { padding: 0 12px; }
            .meal-grid { grid-template-columns: 1fr; gap: 13px; }
            .meal-card { display: grid; grid-template-columns: 40% 1fr; }
            .photo-wrap { height: 100%; min-height: 164px; aspect-ratio: auto; }
            .save-button { top: 8px; right: 8px; width: 32px; height: 32px; }
            .card-content { display: flex; flex-direction: column; justify-content: center; padding: 12px; }
            .card-content h3 { min-height: auto; margin-bottom: 13px; font-size: 18px; }
            .card-meta { flex-wrap: wrap; font-size: 9px; }
            .area-label { font-size: 10px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
            .smoke-field::before, .smoke-field::after { animation: none; opacity: .65; }
        }
    </style>
</head>
<body>
    <div class="smoke-field" aria-hidden="true"></div>
    <header class="topbar">
        <a class="brand" href="#top" aria-label="Gather and Plate home"><span class="brand-mark">g</span> gather &amp; plate</a>
        <span class="top-note">A little inspiration for what’s cooking</span>
    </header>

    <main id="top">
        <section class="hero" aria-labelledby="page-title">
            <div class="hero-copy">
                <p class="eyebrow">Good food, found</p>
                <h1 id="page-title">Find something lovely to make.</h1>
                <p>Browse a world of recipes and follow your appetite.</p>
                <form class="search-wrap" id="search-form" role="search">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    <input id="search-input" type="search" placeholder="Try “salmon”, “pasta”, “tacos”…" aria-label="Search recipes" autocomplete="off">
                    <button type="submit">Find recipes</button>
                </form>
            </div>
        </section>

        <section aria-labelledby="recipes-title">
            <div class="toolbar">
                <div class="section-heading">
                    <h2 id="recipes-title">The recipe collection</h2>
                    <p class="result-count" id="result-count" aria-live="polite">Finding recipes…</p>
                </div>
                <div class="filters" aria-label="Recipe filters">
                    <div class="filter-field">
                        <label for="category-filter">Category</label>
                        <select id="category-filter"><option value="">All categories</option></select>
                    </div>
                    <div class="filter-field">
                        <label for="area-filter">Cuisine</label>
                        <select id="area-filter"><option value="">All cuisines</option></select>
                    </div>
                    <div class="filter-field sort">
                        <label for="sort-filter">Sort by</label>
                        <select id="sort-filter">
                            <option value="popular">Name: A to Z</option>
                            <option value="reverse">Name: Z to A</option>
                        </select>
                    </div>
                    <button class="reset-button" id="reset-filters" type="button">Clear filters</button>
                </div>
            </div>
            <div class="meal-grid" id="meals" aria-live="polite" aria-busy="true"></div>
        </section>
    </main>
    <footer>Recipes and photography from TheMealDB</footer>

    <div id="modal-root"></div>

    <script>
        const API_URL = "https://www.themealdb.com/api/json/v1/1/search.php?s=";
        const mealsElement = document.getElementById("meals");
        const searchInput = document.getElementById("search-input");
        const searchForm = document.getElementById("search-form");
        const categoryFilter = document.getElementById("category-filter");
        const areaFilter = document.getElementById("area-filter");
        const sortFilter = document.getElementById("sort-filter");
        const countElement = document.getElementById("result-count");
        const modalRoot = document.getElementById("modal-root");
        const savedMeals = new Set(readSavedMeals());
        let meals = [];
        let searchTimer;
        let requestNumber = 0;

        function readSavedMeals() {
            try {
                return JSON.parse(localStorage.getItem("gather-saved-meals") || "[]");
            } catch {
                return [];
            }
        }

        function escapeHtml(value = "") {
            return String(value).replace(/[&<>"']/g, character => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[character]);
        }

        function getYoutubeEmbedUrl(value) {
            try {
                const url = new URL(value);
                const host = url.hostname.replace(/^www\./, "").toLowerCase();
                let videoId = "";
                if (host === "youtu.be") {
                    videoId = url.pathname.split("/").filter(Boolean)[0] || "";
                } else if (["youtube.com", "m.youtube.com", "youtube-nocookie.com"].includes(host)) {
                    videoId = url.searchParams.get("v") || url.pathname.match(/^\/(?:embed|shorts)\/([^/]+)/)?.[1] || "";
                }
                return /^[\w-]{11}$/.test(videoId) ? `https://www.youtube-nocookie.com/embed/${videoId}` : "";
            } catch {
                return "";
            }
        }

        function showState(title, message, loading = false) {
            mealsElement.setAttribute("aria-busy", String(loading));
            mealsElement.innerHTML = `<div class="state-message">${loading ? '<div class="spinner" aria-hidden="true"></div>' : ""}<h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p></div>`;
            countElement.textContent = loading ? "Finding recipes…" : "";
        }

        async function loadMeals(query = "") {
            const currentRequest = ++requestNumber;
            showState("A moment in the kitchen…", "Gathering recipes for you.", true);
            try {
                const response = await fetch(`${API_URL}${encodeURIComponent(query.trim())}`);
                if (!response.ok) throw new Error("The recipe service returned an error.");
                const data = await response.json();
                if (currentRequest !== requestNumber) return;
                meals = Array.isArray(data.meals) ? data.meals : [];
                updateFilterOptions();
                renderMeals();
            } catch (error) {
                if (currentRequest !== requestNumber) return;
                showState("Recipes are taking a little break", "Check your connection and try searching again.");
            }
        }

        function updateFilterOptions() {
            const currentCategory = categoryFilter.value;
            const currentArea = areaFilter.value;
            const categories = [...new Set(meals.map(meal => meal.strCategory).filter(Boolean))].sort();
            const areas = [...new Set(meals.map(meal => meal.strArea).filter(Boolean))].sort();
            categoryFilter.innerHTML = '<option value="">All categories</option>' + categories.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
            areaFilter.innerHTML = '<option value="">All cuisines</option>' + areas.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
            if (categories.includes(currentCategory)) categoryFilter.value = currentCategory;
            if (areas.includes(currentArea)) areaFilter.value = currentArea;
        }

        function getVisibleMeals() {
            const visibleMeals = meals.filter(meal =>
                (!categoryFilter.value || meal.strCategory === categoryFilter.value) &&
                (!areaFilter.value || meal.strArea === areaFilter.value)
            );
            return visibleMeals.sort((first, second) => {
                const comparison = first.strMeal.localeCompare(second.strMeal);
                return sortFilter.value === "reverse" ? -comparison : comparison;
            });
        }

        function heartIcon(filled) {
            return `<svg viewBox="0 0 24 24" fill="${filled ? "currentColor" : "none"}" aria-hidden="true"><path d="M20.8 8.7c0 4.1-8.8 10-8.8 10s-8.8-5.9-8.8-10A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        }

        function renderMeals() {
            const visibleMeals = getVisibleMeals();
            mealsElement.setAttribute("aria-busy", "false");
            const total = meals.length;
            countElement.textContent = visibleMeals.length === total
                ? `${total} ${total === 1 ? "recipe" : "recipes"} to explore`
                : `${visibleMeals.length} of ${total} recipes`;

            if (!visibleMeals.length) {
                showState("Nothing on the menu yet", "Try another search or clear a filter to see more recipes.");
                return;
            }

            mealsElement.innerHTML = visibleMeals.map((meal, index) => {
                const isSaved = savedMeals.has(meal.idMeal);
                return `<article class="meal-card" style="animation-delay:${Math.min(index, 8) * 35}ms">
                    <div class="photo-wrap">
                        <img class="meal-photo" src="${escapeHtml(meal.strMealThumb)}" alt="${escapeHtml(meal.strMeal)}" loading="lazy">
                        <button class="save-button${isSaved ? " is-saved" : ""}" type="button" data-save="${escapeHtml(meal.idMeal)}" aria-label="${isSaved ? "Remove saved recipe" : "Save recipe"}" aria-pressed="${isSaved}">${heartIcon(isSaved)}</button>
                    </div>
                    <div class="card-content">
                        <div class="card-meta"><span class="category-pill">${escapeHtml(meal.strCategory || "Recipe")}</span><span class="meta-dot">·</span><span>${escapeHtml(meal.strArea || "Worldwide")}</span></div>
                        <h3>${escapeHtml(meal.strMeal)}</h3>
                        <div class="card-footer"><span class="area-label">A recipe worth keeping</span><button class="details-button" type="button" data-meal="${escapeHtml(meal.idMeal)}">View recipe <span aria-hidden="true">→</span></button></div>
                    </div>
                </article>`;
            }).join("");
        }

        function openRecipe(meal) {
            const ingredients = [];
            for (let index = 1; index <= 20; index += 1) {
                const ingredient = meal[`strIngredient${index}`]?.trim();
                if (ingredient) ingredients.push({ ingredient, measure: meal[`strMeasure${index}`]?.trim() || "" });
            }
            const instructionText = (meal.strInstructions || "Instructions are not available.").trim();
            const videoEmbedUrl = getYoutubeEmbedUrl(meal.strYoutube || "");
            const sourceLink = meal.strSource ? `<a href="${escapeHtml(meal.strSource)}" target="_blank" rel="noopener noreferrer">Original recipe ↗</a>` : "";
            const videoLink = meal.strYoutube ? `<a href="${escapeHtml(meal.strYoutube)}" target="_blank" rel="noopener noreferrer">Watch the video ↗</a>` : "";
            modalRoot.innerHTML = `<div class="modal-backdrop" data-dismiss="true">
                <section class="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                    <button class="modal-close" type="button" aria-label="Close recipe">&times;</button>
                    <div class="modal-media">
                        <img class="modal-photo" src="${escapeHtml(meal.strMealThumb)}" alt="${escapeHtml(meal.strMeal)}">
                        ${videoEmbedUrl ? `<iframe class="modal-video" src="${videoEmbedUrl}" title="${escapeHtml(meal.strMeal)} recipe video" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>` : ""}
                    </div>
                    <div class="modal-body">
                        <p class="eyebrow">${escapeHtml(meal.strCategory || "Recipe")}</p>
                        <h2 id="modal-title">${escapeHtml(meal.strMeal)}</h2>
                        <p class="modal-subtitle">${escapeHtml(meal.strArea || "Worldwide cuisine")}</p>
                        <div class="modal-columns">
                            <div><h3>Ingredients</h3><ul class="ingredients">${ingredients.map(item => `<li><span>${escapeHtml(item.ingredient)}</span><span>${escapeHtml(item.measure)}</span></li>`).join("")}</ul></div>
                            <div><h3>Method</h3><div class="instructions">${escapeHtml(instructionText)}</div><div class="modal-links">${sourceLink}${videoLink}</div></div>
                        </div>
                    </div>
                </section>
            </div>`;
            modalRoot.querySelector(".modal-close").focus();
        }

        function closeRecipe() { modalRoot.innerHTML = ""; }

        function toggleSaved(mealId) {
            if (savedMeals.has(mealId)) savedMeals.delete(mealId);
            else savedMeals.add(mealId);
            try {
                localStorage.setItem("gather-saved-meals", JSON.stringify([...savedMeals]));
            } catch {
                // Saving remains available for this visit when storage is disabled.
            }
            renderMeals();
        }

        searchForm.addEventListener("submit", event => {
            event.preventDefault();
            clearTimeout(searchTimer);
            loadMeals(searchInput.value);
        });
        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadMeals(searchInput.value), 400);
        });
        categoryFilter.addEventListener("change", renderMeals);
        areaFilter.addEventListener("change", renderMeals);
        sortFilter.addEventListener("change", renderMeals);
        document.getElementById("reset-filters").addEventListener("click", () => {
            searchInput.value = "";
            categoryFilter.value = "";
            areaFilter.value = "";
            sortFilter.value = "popular";
            loadMeals();
        });
        mealsElement.addEventListener("click", event => {
            const saveButton = event.target.closest("[data-save]");
            if (saveButton) {
                toggleSaved(saveButton.dataset.save);
                return;
            }
            const detailsButton = event.target.closest("[data-meal]");
            if (detailsButton) {
                const meal = meals.find(item => item.idMeal === detailsButton.dataset.meal);
                if (meal) openRecipe(meal);
            }
        });
        modalRoot.addEventListener("click", event => {
            if (event.target.matches("[data-dismiss], .modal-close")) closeRecipe();
        });
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeRecipe();
        });

        loadMeals();
    </script>
</body>
</html>
